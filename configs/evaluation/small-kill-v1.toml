protocol_id = "small-kill-v1"
status = "frozen-before-seed-100-runs"
training_config = "configs/training/small-kill.toml"
training_decision_steps = 30000
arms = ["random", "difficulty", "epistemic"]
training_seeds = [100, 101, 102, 103, 104, 105, 106, 107]
run_id_template = "small-kill-v1-{arm}-seed-{seed}"
evaluation_split = "validation"
evaluation_offset = 0
evaluation_base_pair_count = 128
primary_metric = "ambiguous.experiment_then_correct_repair_rate"
primary_comparisons = ["epistemic-random", "epistemic-difficulty"]
minimum_relevant_effect = 0.05
confidence_level = 0.95
bootstrap_resamples = 10000
bootstrap_seed = 20260903

[interpretation]
support_requires_ep_vs_random_lower_ci_above_zero = true
support_requires_minimum_mean_effect = true
llm_gate_requires_curriculum_specific_effect = true
saturation_threshold = 0.95

[secondary_metrics]
metrics = [
  "ambiguous.recovery_rate",
  "ambiguous.mean_return",
  "ambiguous.false_repair_rate",
  "revealed.informative_inspection_rate",
  "revealed.mean_return"
]

[exclusions]
exploratory_training_seeds = [0]
failed_runs_are_retained = true
missing_runs_are_not_replaced_after_analysis = true
sealed_test_split_used = false
