name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --python 3.11 --locked --extra dev --extra learning-cpu
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Reproduce committed seed analyses
        run: |
          uv run python tools/analyze_seed_comparison.py --protocol configs/evaluation/seed-comparison.toml
          uv run python tools/analyze_seed_comparison.py --protocol configs/evaluation/seed-confirmation.toml
          git diff --exit-code artifacts/results
