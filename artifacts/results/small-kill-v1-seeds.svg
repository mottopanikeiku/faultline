<desc id="description">Each point is recomputed from ambiguous evaluation episode rows in artifacts/results/small-kill-v1-*-seed-*.json. Colored lines connect the same training seed across curricula, not a trajectory over time. Black bars are means. Diagnostic success requires advance, informative inspection and correct repair. These are validation results, not new training runs.</desc>
